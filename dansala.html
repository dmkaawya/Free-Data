<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Simple Web Testing</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 50px; 
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        input, button { 
            padding: 10px; 
            margin-top: 10px; 
            width: 100%; 
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .result-box {
            margin-top: 20px;
            padding: 10px;
            background: #e9ecef;
            border-left: 5px solid #28a745;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Firebase Realtime Database Test</h2>
    
    <label for="nameInput">Namak athuluth karanna:</label>
    <input type="text" id="nameInput" placeholder="Udaharanayak: Kamal ...">
    <button id="saveBtn">Database ekata danna</button>

    <div class="result-box">
        <h3>Database eke thiyena nama:</h3>
        <p id="displayName">Thama data na...</p>
    </div>
</div>

<script type="module">
    // Firebase modules CDN (web links) walin kelinma gannawa
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Oyage Firebase Account eke configuration eka
    const firebaseConfig = {
        apiKey: "AIzaSyCu0eCHqEnAOsMqscWYs7y-pAlkrVF-HCE",
        authDomain: "dansalalk-202599.firebaseapp.com",
        databaseURL: "https://dansalalk-202599-default-rtdb.firebaseio.com",
        projectId: "dansalalk-202599",
        storageBucket: "dansalalk-202599.firebasestorage.app",
        messagingSenderId: "865555501035",
        appId: "1:865555501035:web:c462210930f1c9a32f93ae",
        measurementId: "G-0TXHDENFFY"
    };

    // Firebase app eka saha Database eka start kirima
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // HTML elements tika JS walata gannawa
    const nameInput = document.getElementById('nameInput');
    const saveBtn = document.getElementById('saveBtn');
    const displayName = document.getElementById('displayName');

    // -------------------------------------------------------------
    // 1. DATA WRITE KARANA VIDITHA (Database ekata data yawamu)
    // -------------------------------------------------------------
    saveBtn.addEventListener('click', () => {
        const textValue = nameInput.value;
        
        if(textValue !== "") {
            // 'savedData' kiyana path eka athule 'currentName' kiyala key ekakata save karanawa
            set(ref(db, 'savedData'), {
                currentName: textValue
            })
            .then(() => {
                alert("Nama සාර්ථකව save wuna!");
                nameInput.value = ""; // Input box eka clear karanawa
            })
            .catch((error) => {
                console.error("Error ekak:", error);
            });
        } else {
            alert("Karunakara namak type karala inna!");
        }
    });

    // -------------------------------------------------------------
    // 2. DATA READ KARANA VIDITHA (Database eken live data gamu)
    // -------------------------------------------------------------
    // Database eke 'savedData' kiyana thana wenas wena hemawelawakatama meka live run wenawa
    const databaseRef = ref(db, 'savedData');
    onValue(databaseRef, (snapshot) => {
        const data = snapshot.val();
        
        if(data && data.currentName) {
            // Database eke thiyena nama HTML ekata danawa
            displayName.innerText = data.currentName;
        } else {
            displayName.innerText = "Database eke mukuthma na!";
        }
    });
</script>

</body>
</html>
