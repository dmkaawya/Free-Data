<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayNova — Unique Payment Flows</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif}
    .glass{background:rgba(255,255,255,0.03);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08)}
    html:not(.dark) .glass{background:rgba(255,255,255,0.7);border:1px solid rgba(0,0,0,0.08)}

    /* ===== CARD 3D ===== */
    .card-perspective{perspective:1200px;width:100%;max-width:380px;height:230px}
    .card-body{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
    .card-body.flipped{transform:rotateY(180deg)}
    .card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:24px;overflow:hidden}
    .card-front{background:linear-gradient(135deg,#0c0c1d 0%,#1a0a2e 40%,#0d1b3e 100%);border:1px solid rgba(255,255,255,0.12);box-shadow:0 30px 60px rgba(0,0,0,0.5),0 0 40px rgba(88,28,135,0.15)}
    .card-front::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,0.03),transparent 30%);animation:hologram 6s linear infinite}
    @keyframes hologram{to{transform:rotate(360deg)}}
    .card-back{background:linear-gradient(135deg,#0c0c1d,#1a0a2e,#0d1b3e);border:1px solid rgba(255,255,255,0.12);transform:rotateY(180deg);box-shadow:0 30px 60px rgba(0,0,0,0.5)}
    .mag-strip{height:46px;background:repeating-linear-gradient(90deg,#111,#222 2px,#111 4px);margin:-24px -24px 0}
    .sig-box{height:36px;background:#e8e4d9;border-radius:4px;margin:16px 20px 0;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;font-style:italic;font-size:11px;color:#555}
    .chip{width:48px;height:34px;border-radius:6px;background:linear-gradient(135deg,#c9a84c,#f0d060,#c9a84c);position:relative;overflow:hidden}
    .chip::before{content:'';position:absolute;inset:4px;border:1px solid rgba(0,0,0,0.15);border-radius:3px}
    .chip::after{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(0,0,0,0.08)}
    .contactless{opacity:.5}

    /* ===== PHONE MOCKUP ===== */
    .phone-frame{width:220px;height:420px;border-radius:32px;border:3px solid #333;background:#0a0a0a;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.1)}
    .phone-notch{width:100px;height:24px;background:#0a0a0a;border-radius:0 0 16px 16px;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:10}
    .phone-screen{position:absolute;inset:8px;border-radius:26px;overflow:hidden}

    /* ===== BLOCKCHAIN ===== */
    .chain-node{width:60px;height:60px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;transition:all .5s}
    .chain-link{height:2px;flex:1;position:relative;overflow:hidden;min-width:30px}
    .chain-link::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,#22d3ee,transparent);animation:chainFlow 1.5s linear infinite}
    @keyframes chainFlow{to{left:100%}}

    /* ===== FINGERPRINT ===== */
    .fp-ring{position:absolute;border-radius:50%;border:2px solid rgba(249,115,22,0.3);animation:fpPulse 2s ease-out infinite}
    @keyframes fpPulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.5);opacity:0}}

    /* ===== BNPL ===== */
    .install-bar{height:48px;border-radius:10px;position:relative;overflow:hidden;transition:all .5s}
    .install-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);animation:shimmer 2s infinite;background-size:200% 100%}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

    /* ===== QR RADAR ===== */
    .radar-ring{position:absolute;border:2px solid;border-radius:50%;animation:radarPulse 2s ease-out infinite}
    @keyframes radarPulse{0%{transform:scale(.5);opacity:.8}100%{transform:scale(2);opacity:0}}

    /* ===== BANK WIRE ===== */
    .wire-dot{width:8px;height:8px;border-radius:50%;position:absolute;animation:wireTravel 2s linear infinite}
    @keyframes wireTravel{0%{left:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:100%;opacity:0}}

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @keyframes bounceIn{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.05)}70%{transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes checkDraw{0%{stroke-dashoffset:100}100%{stroke-dashoffset:0}}
    @keyframes progressBar{0%{width:0}100%{width:100%}}
    @keyframes confetti{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(250px) rotate(720deg)}}
    @keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes glow{0%,100%{box-shadow:0 0 20px rgba(249,115,22,0.2)}50%{box-shadow:0 0 40px rgba(249,115,22,0.4)}}
    @keyframes typewriter{from{width:0}to{width:100%}}
    @keyframes scanLine{0%{top:0}100%{top:100%}}
    @keyframes coinSpin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
    @keyframes vaultOpen{0%{transform:perspective(500px) rotateY(0)}100%{transform:perspective(500px) rotateY(-30deg)}}
    @keyframes splitFill{0%{width:0}100%{width:100%}}

    .fade-up{animation:fadeInUp .5s ease forwards}
    .bounce-in{animation:bounceIn .6s ease forwards}
    .slide-in{animation:slideIn .4s ease forwards}
    .spinner{width:48px;height:48px;border:3px solid rgba(249,115,22,0.2);border-top-color:#F97316;border-radius:50%;animation:spin .8s linear infinite}
    .confetti-p{position:absolute;animation:confetti 1.5s ease forwards}

    .toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
    .toggle-switch input{opacity:0;width:0;height:0}
    .toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#525252;border-radius:24px;transition:.3s}
    .toggle-slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s}
    .toggle-switch input:checked+.toggle-slider{background:#F97316}
    .toggle-switch input:checked+.toggle-slider:before{transform:translateX(20px)}

    .toast{position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 20px;border-radius:10px;font-size:14px;transform:translateY(100px);opacity:0;transition:all .3s;font-weight:500}
    .toast.show{transform:translateY(0);opacity:1}
    .dark .toast{background:#F97316;color:white}
    html:not(.dark) .toast{background:#EA580C;color:white}

    .method-card{transition:all .3s cubic-bezier(.4,0,.2,1);cursor:pointer;position:relative;overflow:hidden}
    .method-card:hover{transform:translateY(-4px)}
    .dark .method-card:hover{box-shadow:0 8px 30px rgba(249,115,22,0.08);background:rgba(255,255,255,0.05)}
    html:not(.dark) .method-card:hover{box-shadow:0 8px 30px rgba(0,0,0,0.08);background:rgba(255,255,255,0.9)}
    .input-f{transition:all .2s}.input-f:focus{border-color:#F97316!important;box-shadow:0 0 0 3px rgba(249,115,22,0.1)}

    .cat-tab{transition:all .2s;cursor:pointer}
    .dark .cat-tab:hover,.dark .cat-tab.active{background:rgba(249,115,22,0.1);color:#F97316;border-color:rgba(249,115,22,0.3)}
    html:not(.dark) .cat-tab:hover,html:not(.dark) .cat-tab.active{background:rgba(249,115,22,0.05);color:#EA580C;border-color:rgba(249,115,22,0.3)}

    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#525252;border-radius:3px}
  </style>
</head>

function startFlow(id){cur=M.find(m=>m.id===id);step=1;const sm={card:4,login:4,bank:4,crypto:4,biometric:3,bnpl:4,qr:4,redirect:4};steps=sm[cur.flow]||4;showView('flow');drawSteps();drawContent()}
function drawSteps(){
  const names={card:['Card Details','Confirm','Processing','Receipt'],login:['Sign In','Authorize','Processing','Receipt'],bank:['Account','Verify','Processing','Receipt'],crypto:['Wallet','Confirm','Processing','Receipt'],biometric:['Authenticate','Processing','Receipt'],bnpl:['Choose Plan','Confirm','Processing','Receipt'],qr:['Scan QR','Verify','Processing','Receipt'],redirect:['Redirect','Approve','Processing','Receipt']};
  const sn=names[cur.flow]||['Step 1','Step 2','Processing','Receipt'];
  let h='';
  for(let i=1;i<=steps;i++){const d=i<step,a=i===step;
    h+=`<div class="flex flex-col items-center" style="animation:fadeInUp .3s ease ${i*.08}s both">
      <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-semibold border-2 transition-all ${d?'bg-orange-500 border-orange-500 text-white':a?'border-orange-500 text-orange-400 dark:bg-orange-500/10':'border-neutral-700 dark:text-neutral-600 text-neutral-400'}">${d?'<i data-lucide="check" class="w-3.5 h-3.5"></i>':i}</div>
      <div class="text-[9px] mt-1.5 dark:text-neutral-500 text-neutral-400 max-w-[60px] text-center leading-tight">${sn[i-1]}</div></div>`;
    if(i<steps)h+=`<div class="flex-1 h-0.5 mt-5 mx-1.5 rounded-full transition-all ${i<step?'bg-orange-500':'dark:bg-neutral-800 bg-neutral-200'}"></div>`;
  }

}
function next(){if(step<steps){step++;drawSteps();drawContent()}}

  const a=document.getElementById('flowContent');a.innerHTML='';

}

function bang(){
  const c=document.getElementById('cBox');if(!c)return;
  const cols=['#F97316','#22C55E','#3B82F6','#EAB308','#EC4899','#8B5CF6','#06B6D4','#EF4444'];
  for(let i=0;i<50;i++){const p=document.createElement('div');p.className='confetti-p';p.style.left=Math.random()*100+'%';p.style.top='-10px';p.style.background=cols[Math.floor(Math.random()*cols.length)];p.style.animationDelay=Math.random()*.6+'s';p.style.animationDuration=(1+Math.random())+'s';p.style.width=(4+Math.random()*8)+'px';p.style.height=(4+Math.random()*8)+'px';p.style.borderRadius=Math.random()>.5?'50%':'2px';c.appendChild(p)}
}

function renderSets(){
  const c=document.getElementById('settingsContent');let h='';
  SETS.forEach((cat,ci)=>{
    h+=`<div class="mb-8" style="animation:fadeInUp .4s ease ${ci*.1}s both">

        <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-${s.c}-500/10 flex items-center justify-center flex-shrink-0"><i data-lucide="${s.i}" class="w-4 h-4 text-${s.c}-400"></i></div><div><div class="text-sm font-medium dark:text-white text-neutral-900">${s.n}</div><div class="text-[10px] dark:text-neutral-500 text-neutral-400">${s.d}</div></div></div>
        <label class="toggle-switch"><input type="checkbox" ${s.on?'checked':''} onchange="toast('${s.n} '+(this.checked?'enabled':'disabled'))"><span class="toggle-slider"></span></label>

    });
    h+=`</div></div>`;
  });
  c.innerHTML=h;lucide.createIcons();
}
